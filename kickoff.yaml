# kickoff.yaml — human-editable kickoff execution configuration.
#
# Validated and updated by bin/kickoff-config. Direct edits are supported.
# Commands update only their owned section, preserve comments and extension
# keys, validate before writing, and replace this file atomically.

version: 1

# Authority and deployment selection; explicit pins describe the invoking model.
workflow:
  mode: auto
  primary_models: {claude: opus, codex: astra}
  eligible_primary_models: [astra, opus]
  review_preference: cross-vendor
  adviser_models:
    claude:
      reviewer: [astra]
      critic: [astra]
    codex:
      reviewer: [opus]
      critic: [opus]
  allowed_harnesses: [claude, codex]
  targets:
    astra:
      harness: codex
      model: gpt-6-astra
      provider: openai
      backend: direct
      auth: subscription
      efforts: [low, medium, high, xhigh, max]
      # Shared account windows always apply. This explicit mapping excludes
      # additional groups; revisit it when the provider adds or renames one.
      # As of 2026-09-13 the only additional group is explicitly named Spark.
      usage_windows: [primary_window]
      terms: operator-configured subscription access
      credential_env: []
      backend_env: {}

# Optional project- or harness-specific keys may be added here. The current
# manager preserves unknown extension data without interpreting it.
extensions: {}

# Which model and implied harness runs each canonical role. A harness section
# overrides `default` when that harness orchestrates kickoff.
role_models:
  default:
    planner:
      model: sol
      effort: xhigh
    reviewer:
      model: sol
      effort: high
    coder:
      model: sol
      effort: high
    critic:
      model: sol
      effort: xhigh
  claude:
    planner:
      model: opus
      effort: high
    reviewer:
      model: astra
      effort: high
    coder:
      model: opus
      effort: high
    critic:
      model: astra
      effort: high
  codex:
    planner:
      model: astra
      effort: high
    reviewer:
      model: astra
      effort: high
    coder:
      model: astra
      effort: high
    critic:
      model: astra
      effort: high
research_budgets:
  planner: 12
  reviewer: 6
  coder: 0
  critic: 0
role_timeouts:
  first_event_timeout_seconds: 120
  minimum_samples_for_recalibration: 30
  recalibration_multiplier: 2.0
  roles:
    planner:
      hard_timeout_seconds: 1800
      idle_timeout_seconds: 600
      claude_max_turns: 50
      hard_floor_seconds: 1800
      idle_floor_seconds: 600
    reviewer:
      hard_timeout_seconds: 1800
      idle_timeout_seconds: 600
      claude_max_turns: 50
      hard_floor_seconds: 1800
      idle_floor_seconds: 600
    coder:
      hard_timeout_seconds: 7200
      idle_timeout_seconds: 1200
      claude_max_turns: 200
      hard_floor_seconds: 7200
      idle_floor_seconds: 1200
    critic:
      hard_timeout_seconds: 2700
      idle_timeout_seconds: 600
      claude_max_turns: 50
      hard_floor_seconds: 2700
      idle_floor_seconds: 600
run_budgets:
  self_resume: 3
