name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Install pinned uv
        run: |
          python3 -m pip install --target "${RUNNER_TEMP}/uv-tools" uv==0.9.26
          echo "${RUNNER_TEMP}/uv-tools/bin" >> "$GITHUB_PATH"
      - name: Install locked environment
        run: ./bin/setup
      - name: Full package gate
        run: ./bin/check
      - name: Exact wheel and validated sdist qualification
        shell: bash
        run: |
          ./bin/python .github/scripts/package-qualify.py --uv "$(command -v uv)" --output "${RUNNER_TEMP}/castle-artifact-qualification"
