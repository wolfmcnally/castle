[project]
name = "castle"
version = "0.1.1"
description = "Standalone content-addressable snapshot store (Python library + CLI)."
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
readme = "README.md"
authors = [{ name = "Wolf McNally", email = "wolf@wolfmcnally.com" }]

[project.scripts]
castle = "castle.cli:main"

[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["castle"]

[dependency-groups]
dev = [
    "pyyaml>=6.0",
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.uv]
required-version = ">=0.9.26"
python-preference = "only-managed"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
